name: Deploy

# Builds the site with fresh California license data and deploys it to
# Cloudflare: on every push to main, and every Monday and Thursday so the
# California search stays within a few days of the CSLB file (and the cached
# fallback copy is used often enough that GitHub doesn't evict it). Needs the
# CLOUDFLARE_API_TOKEN repository secret (see README).
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * 1,4'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore the last CSLB download
        uses: actions/cache/restore@v4
        with:
          path: .cache/cslb
          key: cslb-${{ github.run_id }}
          restore-keys: cslb-
      - name: Download California licenses and build the search index
        run: npm run data:ca
      - name: Keep this CSLB download as the fallback for next time
        uses: actions/cache/save@v4
        with:
          path: .cache/cslb
          key: cslb-${{ github.run_id }}
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Accept the token even if it was pasted with spaces, a line break,
          # quotes, a "Bearer " prefix or the whole test command Cloudflare shows.
          if printf '%s' "$RAW_TOKEN" | grep -qi 'bearer'; then
            token=$(printf '%s' "$RAW_TOKEN" | tr '\n' ' ' | sed -E 's/.*[Bb]earer[[:space:]]+([A-Za-z0-9_-]+).*/\1/')
          else
            token=$(printf '%s' "$RAW_TOKEN" | tr -d '[:space:]"'"'")
          fi
          if [ -z "$token" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret to deploy (see README)."
            exit 1
          fi
          echo "::add-mask::$token"
          check=$(curl -s -H "Authorization: Bearer $token" https://api.cloudflare.com/client/v4/user/tokens/verify || true)
          if printf '%s' "$check" | grep -q '"status": *"active"'; then
            echo "Cloudflare accepted the token."
          else
            echo "::warning::Cloudflare didn't confirm CLOUDFLARE_API_TOKEN (${#token} characters). Create a token from the 'Edit Cloudflare Workers' template and paste only the token into the secret. Cloudflare said: $(printf '%s' "$check" | head -c 300)"
          fi
          CLOUDFLARE_API_TOKEN="$token" npx wrangler deploy
