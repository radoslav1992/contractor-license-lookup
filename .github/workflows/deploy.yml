name: Deploy

# Builds the site with fresh California license data and deploys it to
# Cloudflare: on every push to main, and every Monday so the California search
# is never more than a week behind the CSLB file. Needs the
# CLOUDFLARE_API_TOKEN repository secret (see README).
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 10 * * 1'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Restore the last CSLB download
        uses: actions/cache/restore@v4
        with:
          path: .cache/cslb
          key: cslb-${{ github.run_id }}
          restore-keys: cslb-
      - name: Download California licenses and build the search index
        run: npm run data:ca
      - name: Keep this CSLB download as the fallback for next time
        uses: actions/cache/save@v4
        with:
          path: .cache/cslb
          key: cslb-${{ github.run_id }}
      - run: npm run build
      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret to deploy (see README)."
            exit 1
          fi
          npx wrangler deploy
