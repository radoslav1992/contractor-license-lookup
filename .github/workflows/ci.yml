name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Deploy from GitHub as well as from Cloudflare's own builds, which can stall
      # at "Initializing build environment". Only for pushes to main, and only once
      # the CLOUDFLARE_API_TOKEN repository secret exists.
      - name: Check for a Cloudflare token
        id: token
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: if [ -n "$TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Deploy to Cloudflare
        if: steps.token.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
